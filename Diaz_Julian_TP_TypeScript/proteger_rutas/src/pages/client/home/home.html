<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Food Store - Catálogo de Delicias</title>
    <link rel="stylesheet" href="../../../style.css">
</head>

<body>
    <header class="header">
        <div class="header-left">
            <a href="./home.html" class="logo">FoodStore</a>
        </div>
        <div class="header-right">
            <a href="./home.html" class="nav-link active">Catálogo</a>
            <a href="../cart/cart.html" class="nav-link cart-link">
                Carrito <span id="cart-badge" class="cart-badge">0</span>
            </a>
        </div>
    </header>
    
    <div class="main-container">
        <aside class="sidebar">
            <h3>Categorías</h3>
            <ul id="categories-list" class="categories-menu">

            </ul>
        </aside>

        <main class="content-area">

            <section class="search-section">
                <input
                    type="text"
                    id="search-input"
                    placeholder="Buscar un plato delicioso..."
                    autocomplete="off"
                />
            </section>

            <div id="toast-notification" class="toast hidden"></div>

            <section id="products-catalog" class="products-grid">

            </section>
        </main>
    </div>
    
    <script type="module" src="./home.ts"></script>
</body>

</html>
